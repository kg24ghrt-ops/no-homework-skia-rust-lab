name: Rust Checks (Fast)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Rust installation
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          clippy --version
        working-directory: native

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-fast-${{ hashFiles('native/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fast-

      - name: Rust formatting check
        run: cargo fmt -- --check
        working-directory: native

      - name: Rust Clippy check
        run: cargo clippy -- -D warnings
        working-directory: native

      - name: Run pure-Rust unit tests (no Skia dependency)
        run: cargo test
        working-directory: native
