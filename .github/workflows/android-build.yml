name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          ndk-version: 26.1.10909125

      - name: Install Rust toolchain for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi, aarch64-linux-android, i686-linux-android, x86_64-linux-android

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('native/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Build native libraries for all ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          NDK_TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for target in armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android; do
            case $target in
              armv7-linux-androideabi)   abi=armeabi-v7a;   clang=armv7a-linux-androideabi21-clang ;;
              aarch64-linux-android)     abi=arm64-v8a;     clang=aarch64-linux-android21-clang ;;
              i686-linux-android)        abi=x86;           clang=i686-linux-android21-clang ;;
              x86_64-linux-android)      abi=x86_64;        clang=x86_64-linux-android21-clang ;;
            esac
            utarget=$(echo "$target" | tr 'a-z-' 'A-Z_')
            mkdir -p "native/target/$target/release"
            export "CC_$utarget=$NDK_TOOLCHAIN/$clang"
            export "CXX_$utarget=$NDK_TOOLCHAIN/${clang%clang}clang++"
            export "AR_$utarget=$NDK_TOOLCHAIN/llvm-ar"
            export "CARGO_TARGET_${utarget}_LINKER=$NDK_TOOLCHAIN/$clang"
            cargo build --release --target "$target"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "native/target/$target/release/libno_homework_native.so" "app/src/main/jniLibs/$abi/"
          done

      - name: Verify native libraries packaged
        run: |
          find app/src/main/jniLibs -name '*.so' -printf '%p\n'

      - name: Build Android app
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libraries
          path: app/src/main/jniLibs/**/*.so
