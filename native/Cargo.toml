[package]
name = "no_homework_native"
version = "0.1.0"
edition = "2021"

[dependencies]
jni = "0.21.0"

# Skia is opt-in: building it pulls in a large prebuilt/source dependency graph.
# Keep it off by default so the pure-Rust core tests run fast (Layer A).
[features]
default = []
skia = ["dep:skia-safe"]

[deps]
skia-safe = { version = "0.41.0", optional = true }

[lib]
crate-type = ["cdylib"]
