plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 34

        defaultConfig {
            applicationId "org.example.nohomework"
            namespace "org.example.nohomework"
            minSdk 21
            targetSdk 34
            versionCode 1
            versionName "1.0"

        // Configure for external native build
        externalNativeBuild {
            ndk {
                // We'll build the native library with Cargo, so we don't need to configure ndkBuild here.
                // Instead, we'll use the `sourceSets` to package the .so file.
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Native libraries are built by Cargo and copied into
    // app/src/main/jniLibs/<abi>/ by the CI build step. Gradle picks up
    // jniLibs from src/main/jniLibs by default, so no custom srcDirs is needed.
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
}
